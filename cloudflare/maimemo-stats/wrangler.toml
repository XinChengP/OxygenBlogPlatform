#:schema node_modules/wrangler/config-schema.json
#
# 墨墨背单词数据接口（Cloudflare Workers）
#
# 职责：GET /api/maimemo/stats 拉取墨墨开放 API，聚合后的数据写入 D1 并返回给前端。
# 设计约定（与 cloudflare/interactions 一致）：
#   - 独立 Worker、同源路由，静态站点仍在 GitHub Pages；
#   - D1 持久化每日新学/复习数与最新快照，墨墨接口失败时用快照兜底；
#   - Token 只存在 Worker Secret（wrangler secret put MAIMEMO_API_TOKEN），不写进仓库。
#
# 部署：
#   cd cloudflare/maimemo-stats
#   npm install
#   npx wrangler d1 create blog-maimemo --location apac   # 生成 database_id 后填到下面
#   npx wrangler secret put MAIMEMO_API_TOKEN             # 粘贴墨墨 Token
#   npx wrangler deploy
#
# 本地调试：把 Token 写进 .dev.vars（已被 .gitignore 忽略）后 npm run dev。

name = "blog-maimemo"
main = "src/index.js"

compatibility_date = "2026-09-23"

# ============================================================================
# D1 持久化
#
# 已于 2026-11-12 创建（区域 apac，创建后不可更改）。
# 启用后每日新学/复习数会持久化，墨墨接口故障时也有快照兜底。
# 若把下面整段注释掉，Worker 会自动降级为「无持久化」模式，接口仍能正常返回。
# ============================================================================
[[d1_databases]]
binding = "DB" # Worker 中通过 env.DB 访问
database_name = "blog-maimemo"
# 区域选 apac（亚太）：与 twikoo / interactions 同理，主区域决定读写往返延迟且创建后不可更改。
database_id = "d92b1370-080b-40f3-acc0-fde2e1fe31c1"

# 同源路由：只有 /api/maimemo/* 被 Worker 接管，前端不需要 CORS / CSP 变更。
# 生效前提：blog.xinchengp.cn 在 Cloudflare 上处于已代理（橙色云）状态。
[[routes]]
pattern = "blog.xinchengp.cn/api/maimemo/*"
zone_name = "xinchengp.cn"

[dev]
port = 8788
