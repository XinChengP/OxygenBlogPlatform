<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Live2D消息功能演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .status-card {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(116, 185, 255, 0.3);
        }
        
        .status-card h2 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .status-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .status-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        .success { color: #00b894; }
        .error { color: #e17055; }
        .warning { color: #fdcb6e; }
        .info { color: #74b9ff; }
        
        .test-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .test-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .test-card h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        
        button { 
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; 
            border: none; 
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }
        
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .secondary-btn {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            box-shadow: 0 4px 10px rgba(253, 121, 168, 0.3);
        }
        
        .secondary-btn:hover {
            box-shadow: 0 6px 15px rgba(253, 121, 168, 0.4);
        }
        
        .test-result { 
            margin: 15px 0; 
            padding: 15px; 
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            border-left: 4px solid #74b9ff;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .message-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            margin: 10px 0;
            transition: border-color 0.3s ease;
        }
        
        .message-input:focus {
            outline: none;
            border-color: #74b9ff;
            box-shadow: 0 0 0 3px rgba(116, 185, 255, 0.1);
        }
        
        .quick-messages {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        
        .quick-msg {
            background: #f1f3f4;
            color: #5f6368;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .quick-msg:hover {
            background: #e8f0fe;
            color: #1a73e8;
            transform: scale(1.05);
        }
        
        .stats-panel {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .feature-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .feature-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        
        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .feature-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }
        
        .feature-desc {
            font-size: 0.9rem;
            color: #718096;
            line-height: 1.5;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .test-section {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Live2D消息功能演示</h1>
        
        <div class="status-card">
            <h2>📊 系统状态监控</h2>
            <div id="status-container">
                <div class="status-item">
                    <span class="status-icon">🔄</span>
                    <span>正在检测Live2D组件状态...</span>
                </div>
            </div>
        </div>

        <div class="stats-panel">
            <h2>📈 实时统计</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-number" id="message-count">0</span>
                    <span class="stat-label">消息发送次数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="test-count">0</span>
                    <span class="stat-label">测试运行次数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="success-rate">0%</span>
                    <span class="stat-label">成功率</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="response-time">0ms</span>
                    <span class="stat-label">平均响应时间</span>
                </div>
            </div>
        </div>

        <div class="test-section">
            <div class="test-card">
                <h3>🎯 基础功能测试</h3>
                <div class="button-group">
                    <button onclick="testBasicMessage()">基础消息</button>
                    <button onclick="testWelcomeMessage()">欢迎消息</button>
                    <button onclick="testLongMessage()">长消息测试</button>
                    <button onclick="testSpecialChars()">特殊字符</button>
                </div>
                <div id="basic-results" class="test-result" style="display:none;"></div>
            </div>

            <div class="test-card">
                <h3>⚡ 高级功能测试</h3>
                <div class="button-group">
                    <button onclick="testRateLimit()">频率限制</button>
                    <button onclick="testBatchMessages()">批量消息</button>
                    <button onclick="testCustomTimeout()">自定义超时</button>
                    <button onclick="testPerformance()">性能测试</button>
                </div>
                <div id="advanced-results" class="test-result" style="display:none;"></div>
            </div>

            <div class="test-card">
                <h3>🎨 自定义消息</h3>
                <input type="text" id="custom-message" class="message-input" placeholder="输入自定义消息内容..." value="天依，你好！这是自定义测试消息～">
                <div class="button-group">
                    <button onclick="sendCustomMessage()">发送消息</button>
                    <button onclick="clearCustomMessage()">清空输入</button>
                </div>
                <div class="quick-messages">
                    <span class="quick-msg" onclick="setQuickMessage('天依，今天天气怎么样？')">天气询问</span>
                    <span class="quick-msg" onclick="setQuickMessage('能给我推荐一首歌吗？')">音乐推荐</span>
                    <span class="quick-msg" onclick="setQuickMessage('今天有什么新内容吗？')">内容更新</span>
                    <span class="quick-msg" onclick="setQuickMessage('谢谢天依！')">感谢</span>
                    <span class="quick-msg" onclick="setQuickMessage('天依最可爱了～')">夸奖</span>
                </div>
                <div id="custom-results" class="test-result" style="display:none;"></div>
            </div>

            <div class="test-card">
                <h3>🎮 互动功能</h3>
                <div class="button-group">
                    <button onclick="runAllTests()" class="secondary-btn">运行所有测试</button>
                    <button onclick="clearAllResults()">清空结果</button>
                    <button onclick="checkLive2DStatus()">刷新状态</button>
                </div>
                <div id="interaction-results" class="test-result" style="display:none;"></div>
            </div>
        </div>

        <div class="feature-grid">
            <div class="feature-item">
                <div class="feature-icon">🎯</div>
                <div class="feature-title">精准消息</div>
                <div class="feature-desc">支持各种长度和格式的消息内容，确保信息准确传达</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">快速响应</div>
                <div class="feature-desc">优化的消息处理机制，提供毫秒级响应时间</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🛡️</div>
                <div class="feature-title">频率保护</div>
                <div class="feature-desc">智能频率限制，防止消息过载，保护用户体验</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <div class="feature-title">性能监控</div>
                <div class="feature-desc">实时监控消息发送状态，提供详细的性能统计</div>
            </div>
        </div>

        <div class="test-result" id="main-results"></div>
    </div>

    <script>
        // 统计数据
        let stats = {
            messageCount: 0,
            testCount: 0,
            successCount: 0,
            totalResponseTime: 0,
            testResults: []
        };

        // 状态显示函数
        function showStatus(message, type = 'info') {
            const statusContainer = document.getElementById('status-container');
            statusContainer.innerHTML = '';
            
            const statusDiv = document.createElement('div');
            statusDiv.className = 'status-item';
            
            const iconMap = {
                'success': '✅',
                'error': '❌',
                'warning': '⚠️',
                'info': 'ℹ️'
            };
            
            statusDiv.innerHTML = `
                <span class="status-icon ${type}">${iconMap[type] || '🔄'}</span>
                <span>${message}</span>
            `;
            statusContainer.appendChild(statusDiv);
        }

        // 记录测试结果
        function recordTest(testName, result, details = '', category = 'basic') {
            stats.testCount++;
            if (result) stats.successCount++;
            
            const responseTime = Date.now() - (window.testStartTime || Date.now());
            stats.totalResponseTime += responseTime;
            
            const resultData = {
                name: testName,
                result: result,
                details: details,
                timestamp: new Date().toLocaleTimeString(),
                responseTime: responseTime
            };
            
            stats.testResults.push(resultData);
            updateStats();
            
            const resultDiv = document.getElementById(category + '-results');
            if (resultDiv) {
                resultDiv.style.display = 'block';
                const resultItem = document.createElement('div');
                resultItem.style.cssText = `
                    margin: 10px 0;
                    padding: 10px;
                    background: ${result ? '#d4edda' : '#f8d7da'};
                    border-left: 4px solid ${result ? '#28a745' : '#dc3545'};
                    border-radius: 4px;
                `;
                resultItem.innerHTML = `
                    <strong>${testName}:</strong> ${result ? '✅ 通过' : '❌ 失败'}
                    <br><small>响应时间: ${responseTime}ms | ${resultData.timestamp}</small>
                    ${details ? '<br>' + details : ''}
                `;
                resultDiv.appendChild(resultItem);
            }
            
            // 主结果面板
            const mainResults = document.getElementById('main-results');
            mainResults.style.display = 'block';
            mainResults.innerHTML = `
                <h3>📋 最新测试结果</h3>
                <div style="background: ${result ? '#d4edda' : '#f8d7da'}; padding: 15px; border-radius: 8px; margin: 10px 0;">
                    <strong>${testName}:</strong> ${result ? '✅ 通过' : '❌ 失败'}
                    <br><small>响应时间: ${responseTime}ms | ${resultData.timestamp}</small>
                    ${details ? '<br>' + details : ''}
                </div>
            `;
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('message-count').textContent = stats.messageCount;
            document.getElementById('test-count').textContent = stats.testCount;
            document.getElementById('success-rate').textContent = 
                stats.testCount > 0 ? Math.round((stats.successCount / stats.testCount) * 100) + '%' : '0%';
            document.getElementById('response-time').textContent = 
                stats.testCount > 0 ? Math.round(stats.totalResponseTime / stats.testCount) + 'ms' : '0ms';
        }

        // 检查Live2D状态
        function checkLive2DStatus() {
            showStatus('正在检测Live2D组件状态...', 'info');
            
            setTimeout(() => {
                // 检查优化版
                if (window.live2dOptimized) {
                    showStatus('✅ Live2D优化版组件已就绪', 'success');
                    const report = window.live2dOptimized.getPerformanceReport();
                    recordTest('Live2D组件状态检测', true, 
                        `性能评分: ${report.score}/100 | 消息队列: ${window.live2dOptimized.messageQueue} | 就绪状态: ${window.live2dOptimized.isReady()}`, 
                        'basic');
                    return;
                }
                
                // 检查原版
                if (window.showMessage && typeof window.showMessage === 'function') {
                    showStatus('✅ Live2D全局消息函数可用', 'success');
                    recordTest('Live2D全局消息检测', true, 'showMessage函数已就绪', 'basic');
                    return;
                }
                
                showStatus('❌ 未检测到Live2D消息功能', 'error');
                recordTest('Live2D组件检测', false, '请先访问主页面确保Live2D组件加载', 'basic');
            }, 1000);
        }

        // 基础消息测试
        function testBasicMessage() {
            window.testStartTime = Date.now();
            const result = window.showMessage && window.showMessage('这是一条基础测试消息～');
            stats.messageCount++;
            recordTest('基础消息测试', result, result ? '基础消息已发送' : 'showMessage函数不可用', 'basic');
        }

        function testWelcomeMessage() {
            window.testStartTime = Date.now();
            const result = window.showMessage && window.showMessage('欢迎来到天依的博客！这里有好多有趣的内容呢～');
            stats.messageCount++;
            recordTest('欢迎消息测试', result, result ? '欢迎消息已发送' : 'showMessage函数不可用', 'basic');
        }

        function testLongMessage() {
            window.testStartTime = Date.now();
            const result = window.showMessage && window.showMessage('这是一条比较长的测试消息，用来测试Live2D看板娘对长文本的显示效果。天依会好好传达每一句话的～');
            stats.messageCount++;
            recordTest('长消息测试', result, result ? '长消息已发送' : 'showMessage函数不可用', 'basic');
        }

        function testSpecialChars() {
            window.testStartTime = Date.now();
            const result = window.showMessage && window.showMessage('特殊字符测试：♪♫☆★○●◎◇◆□■△▲▽▼※→←↑↓〓＃＆＊＠☎☏♀♂♥♠♣♦🎵🎶');
            stats.messageCount++;
            recordTest('特殊字符测试', result, result ? '特殊字符消息已发送' : 'showMessage函数不可用', 'basic');
        }

        // 高级功能测试
        function testRateLimit() {
            window.testStartTime = Date.now();
            let successCount = 0;
            const totalTests = 5;
            
            for (let i = 0; i < totalTests; i++) {
                setTimeout(() => {
                    const result = window.showMessage && window.showMessage(`频率测试消息 ${i + 1}`);
                    if (result) {
                        successCount++;
                        stats.messageCount++;
                    }
                    
                    if (i === totalTests - 1) {
                        recordTest('频率限制测试', successCount > 0, 
                            `成功发送 ${successCount}/${totalTests} 条消息 | 频率限制保护生效`, 'advanced');
                    }
                }, i * 200);
            }
        }

        function testBatchMessages() {
            window.testStartTime = Date.now();
            const messages = [
                '批量消息1：这是第一条测试消息',
                '批量消息2：这是第二条测试消息',
                '批量消息3：这是第三条测试消息',
                '批量消息4：这是第四条测试消息'
            ];
            
            let successCount = 0;
            messages.forEach((msg, index) => {
                setTimeout(() => {
                    const result = window.showMessage && window.showMessage(msg);
                    if (result) {
                        successCount++;
                        stats.messageCount++;
                    }
                    
                    if (index === messages.length - 1) {
                        recordTest('批量消息测试', successCount > 0, 
                            `成功发送 ${successCount}/${messages.length} 条批量消息`, 'advanced');
                    }
                }, index * 500);
            });
        }

        function testCustomTimeout() {
            window.testStartTime = Date.now();
            const result = window.showMessage && window.showMessage('自定义超时测试消息（显示3秒）', 3000);
            stats.messageCount++;
            recordTest('自定义超时测试', result, result ? '自定义超时消息已发送' : 'showMessage函数不可用', 'advanced');
        }

        function testPerformance() {
            window.testStartTime = Date.now();
            const iterations = 10;
            let successCount = 0;
            
            for (let i = 0; i < iterations; i++) {
                setTimeout(() => {
                    const startTime = Date.now();
                    const result = window.showMessage && window.showMessage(`性能测试消息 ${i + 1}`);
                    const endTime = Date.now();
                    
                    if (result) {
                        successCount++;
                        stats.messageCount++;
                    }
                    
                    if (i === iterations - 1) {
                        const avgResponseTime = (endTime - startTime);
                        recordTest('性能压力测试', successCount > 0, 
                            `成功发送 ${successCount}/${iterations} 条消息 | 平均响应时间: ${avgResponseTime}ms`, 'advanced');
                    }
                }, i * 100);
            }
        }

        // 自定义消息功能
        function sendCustomMessage() {
            const message = document.getElementById('custom-message').value.trim();
            if (!message) {
                alert('请输入消息内容！');
                return;
            }
            
            window.testStartTime = Date.now();
            const result = window.showMessage && window.showMessage(message);
            stats.messageCount++;
            recordTest('自定义消息测试', result, 
                result ? `消息已发送: "${message}"` : 'showMessage函数不可用', 'custom');
        }

        function clearCustomMessage() {
            document.getElementById('custom-message').value = '';
            document.getElementById('custom-results').style.display = 'none';
        }

        function setQuickMessage(msg) {
            document.getElementById('custom-message').value = msg;
        }

        // 交互功能
        function runAllTests() {
            document.getElementById('interaction-results').style.display = 'block';
            document.getElementById('interaction-results').innerHTML = '<h4>🚀 正在运行所有测试...</h4>';
            
            // 延迟执行，确保状态检查完成
            setTimeout(() => {
                const tests = [
                    testBasicMessage,
                    testWelcomeMessage,
                    testLongMessage,
                    testSpecialChars
                ];
                
                tests.forEach((test, index) => {
                    setTimeout(test, index * 1500);
                });
                
                setTimeout(() => {
                    testRateLimit();
                    setTimeout(() => testBatchMessages(), 2000);
                    setTimeout(() => testCustomTimeout(), 4000);
                }, tests.length * 1500);
                
                setTimeout(() => {
                    document.getElementById('interaction-results').innerHTML = 
                        '<div style="background: #d4edda; padding: 15px; border-radius: 8px; color: #155724;">' +
                        '✅ 所有测试已完成！请查看上方的测试结果面板。' +
                        '</div>';
                }, (tests.length * 1500) + 6000);
            }, 1000);
        }

        function clearAllResults() {
            // 清空所有结果面板
            ['basic', 'advanced', 'custom', 'interaction'].forEach(category => {
                const element = document.getElementById(category + '-results');
                if (element) {
                    element.style.display = 'none';
                    element.innerHTML = '';
                }
            });
            
            // 清空主结果面板
            document.getElementById('main-results').style.display = 'none';
            document.getElementById('main-results').innerHTML = '';
            
            // 重置统计
            stats = {
                messageCount: 0,
                testCount: 0,
                successCount: 0,
                totalResponseTime: 0,
                testResults: []
            };
            
            updateStats();
            showStatus('结果已清空，可以重新开始测试', 'info');
        }

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkLive2DStatus();
                updateStats();
            }, 1500);
            
            // 定期更新状态
            setInterval(() => {
                if (window.live2dOptimized) {
                    const report = window.live2dOptimized.getPerformanceReport();
                    // 可以在这里添加实时性能监控
                }
            }, 5000);
        });

        // 键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'Enter':
                        e.preventDefault();
                        sendCustomMessage();
                        break;
                    case 'r':
                        e.preventDefault();
                        runAllTests();
                        break;
                    case 'c':
                        e.preventDefault();
                        clearAllResults();
                        break;
                }
            }
        });

        // 暴露全局函数供调试使用
        window.Live2DDemo = {
            stats,
            recordTest,
            checkLive2DStatus,
            runAllTests,
            clearAllResults,
            sendCustomMessage
        };
    </script>
</body>
</html>
