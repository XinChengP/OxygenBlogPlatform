<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩蛋测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 40px;
        }
        .test-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-family: monospace;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Live2D 彩蛋测试页面</h1>
        <p>测试看板娘彩蛋功能是否正常工作</p>
        
        <div id="status" class="status">
            <div class="info">正在检测环境...</div>
        </div>
        
        <div class="test-buttons">
            <button class="test-button" onclick="testShowMessage()">测试 showMessage</button>
            <button class="test-button" onclick="testCopyEvent()">测试复制事件</button>
            <button class="test-button" onclick="testClickEvent()">测试点击事件</button>
            <button class="test-button" onclick="testRegexToString()">测试正则彩蛋</button>
            <button class="test-button" onclick="testAllFeatures()">测试所有功能</button>
        </div>
        
        <div id="log" class="status" style="margin-top: 20px;">
            <div class="info">等待测试...</div>
        </div>
    </div>

    <!-- 引入必要的脚本 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/luotianyi-live2d-master/live2d/js/live2d.js"></script>
    <script src="/luotianyi-live2d-master/live2d/js/message.js"></script>
    
    <script>
        let testResults = [];
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            testResults.push(`[${timestamp}] ${message}`);
            logDiv.innerHTML = `<div class="${className}">${testResults.join('<br>')}</div>`;
        }
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            statusDiv.innerHTML = `<div class="${className}">${message}</div>`;
        }
        
        // 检测环境
        function checkEnvironment() {
            let checks = [];
            
            // 检查 jQuery
            if (typeof $ !== 'undefined') {
                checks.push('✅ jQuery 已加载');
            } else {
                checks.push('❌ jQuery 未加载');
            }
            
            // 检查 Live2D
            if (typeof loadlive2d !== 'undefined') {
                checks.push('✅ Live2D 已加载');
            } else {
                checks.push('❌ Live2D 未加载');
            }
            
            // 检查 showMessage
            if (typeof window.showMessage !== 'undefined') {
                checks.push('✅ window.showMessage 已定义');
            } else {
                checks.push('❌ window.showMessage 未定义');
            }
            
            // 检查消息容器
            setTimeout(() => {
                const messageContainer = document.getElementById('live2d-message');
                if (messageContainer) {
                    checks.push('✅ 消息容器已创建');
                } else {
                    checks.push('⚠️ 消息容器未找到（可能需要初始化）');
                }
                
                updateStatus(checks.join('<br>'), 'info');
            }, 1000);
        }
        
        // 测试 showMessage 函数
        function testShowMessage() {
            log('正在测试 showMessage 函数...', 'info');
            
            try {
                if (typeof window.showMessage === 'function') {
                    window.showMessage('🎉 测试消息：Hello from showMessage!', 3000);
                    log('✅ showMessage 调用成功', 'success');
                } else {
                    log('❌ window.showMessage 不是函数', 'error');
                }
            } catch (error) {
                log(`❌ showMessage 调用失败: ${error.message}`, 'error');
            }
        }
        
        // 测试复制事件彩蛋
        function testCopyEvent() {
            log('正在测试复制事件彩蛋...', 'info');
            
            try {
                const copyEvent = new ClipboardEvent('copy');
                document.dispatchEvent(copyEvent);
                log('✅ 复制事件已触发', 'success');
            } catch (error) {
                log(`❌ 复制事件触发失败: ${error.message}`, 'error');
            }
        }
        
        // 测试点击事件彩蛋
        function testClickEvent() {
            log('正在测试点击事件彩蛋...', 'info');
            
            try {
                document.body.click();
                log('✅ 点击事件已触发', 'success');
            } catch (error) {
                log(`❌ 点击事件触发失败: ${error.message}`, 'error');
            }
        }
        
        // 测试正则 toString 彩蛋
        function testRegexToString() {
            log('正在测试正则 toString 彩蛋...', 'info');
            
            try {
                const regex = /test/;
                const result = regex.toString();
                log(`✅ 正则 toString 调用: ${result}`, 'success');
            } catch (error) {
                log(`❌ 正则 toString 调用失败: ${error.message}`, 'error');
            }
        }
        
        // 测试所有功能
        function testAllFeatures() {
            testResults = [];
            log('开始全面测试...', 'info');
            
            setTimeout(() => testShowMessage(), 500);
            setTimeout(() => testCopyEvent(), 2000);
            setTimeout(() => testClickEvent(), 3500);
            setTimeout(() => testRegexToString(), 5000);
            setTimeout(() => {
                log('🎯 全面测试完成！', 'success');
            }, 6000);
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            setTimeout(() => {
                checkEnvironment();
                log('🚀 测试页面已加载完成', 'success');
            }, 2000);
        });
        
        // 监听消息显示
        document.addEventListener('live2d-message-show', function(e) {
            log(`📢 Live2D消息显示: ${e.detail.message}`, 'success');
        });
        
        document.addEventListener('live2d-message-hide', function(e) {
            log('📢 Live2D消息隐藏', 'info');
        });
    </script>
</body>
</html>
