name: Deploy to GitHub Pages

# 触发条件：推送到main分支或手动触发
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  # 允许手动触发
  workflow_dispatch:
  # 每周一 03:00（北京时间）定时构建：除了刷新内容，
  # 也会顺带执行友链巡检（check:friends 步骤），让友链状态和
  # 「友链最近更新」每周至少更新一次。
  # GitHub Actions cron 使用 UTC，19:00 UTC = 次日 03:00 UTC+8。
  schedule:
    - cron: '0 19 * * 0'

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: true

# 全局环境变量 - 强制使用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: npm ci

      - name: Check friend links
        # 巡检结果写入 public/friends-status.json，随本次构建一起发布；
        # 失败不阻塞部署（脚本内部也有兜底，单站失败不影响其他友链）。
        continue-on-error: true
        run: npm run check:friends

      - name: Prepare for static export
        run: |
          # 删除本地环境文件，避免覆盖 GitHub Actions 的环境变量
          rm -f .env.local

          # 站点地图不再在此处生成：
          # 原先由 generate-sitemap.ts 写入 public/sitemap.xml，但构建时
          # src/app/sitemap.ts 会生成 out/sitemap.xml 并将其覆盖，
          # 两套实现长期并存且可能不一致。现在统一由 app/sitemap.ts 负责，
          # 构建完成后可在 out/sitemap.xml 校验产物。

          # 注意：不再创建 src/actions/index.ts 空实现文件
          # 因为 momentActions.ts、todoActions.ts、backupActions.ts 等文件
          # 已经内置了静态导出模式检测 (isStaticExport)，会自动返回空实现
          echo "静态导出准备完成：使用内置的静态导出模式检测"

      - name: Build project
        env:
          # 设置GitHub Actions环境变量 - 使用 env 块确保变量被正确传递
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PRIVATE_STATIC_EXPORT: "true"
          STATIC_EXPORT: "true"
          CUSTOM_DOMAIN: "true"
          NEXT_PUBLIC_SITE_URL: "https://blog.xinchengp.cn"
          NEXT_PUBLIC_BASE_PATH: ""
          # Twikoo 评论后端地址。必须与 cloudflare/twikoo 实际绑定的一致：
          # 它同时决定前端请求地址与 CSP 白名单，填错会让评论区请求被浏览器拦下。
          NEXT_PUBLIC_TWIKOO_ENV_ID: "https://twikoo.xinchengp.cn"
          # 互动服务（cloudflare/interactions）走同源路由，默认值即可，无需配置。
          # 邮件订阅开关：Resend 域名验证完成并配置 Worker secret 后改为 "true"。
          NEXT_PUBLIC_NEWSLETTER_ENABLED: "false"
          # Telegram 频道入口，配置后 /subscribe 页会展示频道卡片
          NEXT_PUBLIC_TELEGRAM_CHANNEL_URL: ""
        run: |
          # 输出构建环境信息
          echo "构建环境信息："
          echo "NODE_ENV: $NODE_ENV"
          echo "NEXT_PUBLIC_GITHUB_REPO_NAME: $NEXT_PUBLIC_GITHUB_REPO_NAME"
          echo "NEXT_PUBLIC_BASE_PATH: $NEXT_PUBLIC_BASE_PATH"
          echo "NEXT_PUBLIC_SITE_URL: $NEXT_PUBLIC_SITE_URL"
          echo "CUSTOM_DOMAIN: $CUSTOM_DOMAIN"
          echo "NEXT_PUBLIC_TWIKOO_ENV_ID: $NEXT_PUBLIC_TWIKOO_ENV_ID"
          echo "NEXT_PRIVATE_STATIC_EXPORT: $NEXT_PRIVATE_STATIC_EXPORT"
          echo "STATIC_EXPORT: $STATIC_EXPORT"
          # 执行构建（使用 build:pages 脚本，会自动替换 actions 文件）
          npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout (for purge & reindex scripts)
        uses: actions/checkout@v4
        # depth 2：让 reindex 步骤能用 git diff 判断内容是否变更
        with:
          fetch-depth: 2

      - name: Setup Node.js (for purge & reindex scripts)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Detect content changes (for AI reindex)
        id: content_changes
        run: |
          # 定时/手动触发一律重建索引；push 触发时仅当内容相关文件有变更才重建
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git diff --name-only HEAD^ HEAD -- src/content/blogs src/content/moments src/content/changelogs src/data/aiKnowledge.json | wc -l)
          echo "changed=$([[ "$COUNT" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (for reindex)
        if: steps.content_changes.outputs.changed == 'true'
        run: npm ci

      - name: Reindex blog knowledge (Tianyi AI)
        if: steps.content_changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          # 未配置此 secret 时脚本会退出并跳过（部署不受影响）；
          # 值与 cloudflare/interactions Worker 的 ADMIN_TOKEN secret 相同
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: npm run index:blog

      - name: Purge Cloudflare HTML cache
        continue-on-error: true
        env:
          # 未配置这两个 secret 时脚本会静默跳过，不影响部署本身。
          # 创建方式见 docs/cloudflare-optimization.md「部署后自动刷新缓存」
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 部署完成后从线上读取最新 sitemap，拿到全站 HTML 页面清单
          SITEMAP_URL: https://blog.xinchengp.cn/sitemap.xml
        run: node scripts/purge-cloudflare-html.mjs
