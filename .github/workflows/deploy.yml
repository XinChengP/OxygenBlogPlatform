name: Deploy to GitHub Pages

# 触发条件：推送到main分支或手动触发
on:
  push:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

# 全局环境变量 - 强制使用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      - name: Build project
        run: |
          # 设置GitHub Actions环境变量
          export NODE_ENV=production
          export NEXT_PUBLIC_GITHUB_REPO_NAME=${{ github.event.repository.name }}
          export NEXT_PRIVATE_STATIC_EXPORT=true
          # 强制设置自定义域名配置
          export CUSTOM_DOMAIN="true"
          export NEXT_PUBLIC_SITE_URL="https://blog.xinchengp.cn"
          # 强制设置基础路径为空，确保所有资源从根路径加载
          export NEXT_PUBLIC_BASE_PATH=""
          # 输出构建环境信息
          echo "构建环境信息："
          echo "NODE_ENV: $NODE_ENV"
          echo "NEXT_PUBLIC_GITHUB_REPO_NAME: $NEXT_PUBLIC_GITHUB_REPO_NAME"
          echo "NEXT_PUBLIC_BASE_PATH: $NEXT_PUBLIC_BASE_PATH"
          echo "NEXT_PUBLIC_SITE_URL: $NEXT_PUBLIC_SITE_URL"
          echo "CUSTOM_DOMAIN: $CUSTOM_DOMAIN"
          # 执行构建
          npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
