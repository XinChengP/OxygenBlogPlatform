name: Deploy to GitHub Pages

# 触发条件：推送到main分支或手动触发
on:
  push:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      - name: Build project
        run: |
          # 设置GitHub Actions环境变量
          export NODE_ENV=production
          export NEXT_PUBLIC_GITHUB_REPO_NAME=${{ github.event.repository.name }}
          export NEXT_PRIVATE_STATIC_EXPORT=true
          # 读取.env.production文件的环境变量，优先使用自定义域名配置
          if [ -f .env.production ]; then
            export $(grep -v '^#' .env.production | xargs)
          fi
          # 确保基础路径正确设置
          # 对于自定义域名blog.xinchengp.cn，基础路径应为空字符串
          if [ "$NEXT_PUBLIC_SITE_URL" = "https://blog.xinchengp.cn" ] || [ "$CUSTOM_DOMAIN" = "true" ]; then
            export NEXT_PUBLIC_BASE_PATH=""
          else
            # 对于GitHub Pages默认域名，使用仓库名作为基础路径
            export NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}
          fi
          # 输出构建环境信息
          echo "构建环境信息："
          echo "NODE_ENV: $NODE_ENV"
          echo "NEXT_PUBLIC_GITHUB_REPO_NAME: $NEXT_PUBLIC_GITHUB_REPO_NAME"
          echo "NEXT_PUBLIC_BASE_PATH: $NEXT_PUBLIC_BASE_PATH"
          echo "NEXT_PUBLIC_SITE_URL: $NEXT_PUBLIC_SITE_URL"
          echo "CUSTOM_DOMAIN: $CUSTOM_DOMAIN"
          # 执行构建
          npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
